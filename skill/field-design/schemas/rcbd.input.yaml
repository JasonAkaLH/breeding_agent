schema_id: rcbd
version: 1.0.0
title: RCBD design input
description: 随机区组试验设计输入，要求提供材料清单；清单可使用中文或英文表头，区组数/重复数未指定时默认 3。
activation:
  aliases:
    - rcbd
    - RCBD
    - 随机区组
    - 随机完全区组
    - 完全随机区组
inputs:
  material_data:
    type: artifact
    required: false
    title: 材料清单
    question: 请上传或提供材料清单文件。表头和列顺序不固定，只需包含材料名称/代号；如果有对照和分组，也可提供是否对照、组别/分组等列。
    source:
      allowed:
        - artifact
        - upload
        - task_attachment
        - upload_ledger
        - metadata
    aliases:
      - material_data
      - material_file
      - input_file
      - 材料清单
      - 材料表
    validation:
      file_extensions: [.csv, .xls, .xlsx]
  input_data:
    type: string
    required: false
    title: 粘贴的材料表
    question: 如果没有文件，也可以直接粘贴材料名称清单或 CSV 格式材料表；表头可用材料、品种、ped_id、是否对照、组别等语义相近名称。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases:
      - input_data
      - pasted_material_data
      - pasted_data
      - 材料表
  material_names:
    type: string
    required: false
    title: RCBD 材料名称/代号清单
    question: 可直接提供材料、品种或 ped_id 名称，用换行、英文逗号、中文逗号、顿号或分号分隔。RCBD 支持仅名称清单；缺少 hyb_check 和 set 时默认 hyb_check=0、set=1。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases:
      - material_names
      - material_name_list
      - materials
      - ped_ids
      - ped_id_list
      - varieties
      - 材料名称
      - 材料名单
      - 材料清单
      - 品种
      - 品种名称
      - 品种清单
    patterns:
      - '(?:material_names?|materials?|ped_ids?|varieties|材料名称|材料|品种名称|品种)\s*[:：=]\s*(.+)'
  check_names:
    type: string
    required: false
    title: RCBD 对照材料名称
    question: 可选。提供对照或 check 材料名称，用换行、英文逗号、中文逗号、顿号或分号分隔；这些名称会作为 ped_id 行加入并标记为 hyb_check=1。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases:
      - check_names
      - check_name_list
      - check_materials
      - checks
      - ck_names
      - ck_materials
      - 对照品种
      - 对照材料
      - 对照清单
      - 对照名单
    patterns:
      - '(?:check_names?|check_materials?|checks?|ck_names?|ck_materials?|对照品种|对照材料|对照)\s*[:：=]\s*(.+)'
  design:
    type: string
    required: true
    title: 设计类型
    question: 设计类型已选择为 RCBD。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    const: rcbd
    enum: [rcbd]
    aliases: [design, design_type, 设计类型, 试验设计]
    patterns:
      - '(?i)\b(rcbd|randomi[sz]ed complete block)\b'
      - '随机(?:完全)?区组|完全随机区组'
  design_label:
    type: string
    required: false
    title: 设计标识
    question: 可选。用于输出文件命名和区分不同轮次设计，例如 黄淮海。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases:
      - design_label
      - design_name
      - trial_label
      - trial_name
      - project_label
      - project_name
      - output_label
      - region
      - area
      - 设计标识
      - 设计名称
      - 试验名称
      - 项目名称
      - 输出标识
      - 区域
    patterns:
      - '(?:设计标识|设计名称|试验名称|项目名称|输出标识|区域|region|area|design_label|project_name)\s*[:：=]\s*([A-Za-z0-9_.\-\u4e00-\u9fff]{2,40})'
  blocks:
    type: integer
    required: false
    title: 区组数/重复数
    question: 可选。RCBD 的区组数/重复数，未指定时默认 3 个重复。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [blocks, reps, replications, 区组数, 区组, 重复数, 重复]
    default: 3
    patterns:
      - '(?:blocks?|reps?|replications?|区组数|区组|重复数|重复)\s*[:：=]?\s*(\d+)'
      - '(\d+)\s*(?:个|次)?(?:区组|重复|rep|reps|blocks?)'
    validation:
      min: 1
      max: 20
  site_num:
    type: integer
    required: false
    title: 试验地点数
    question: 如果需要多个试点/试验地点，请提供地点数；默认 1 个地点。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    default: 1
    aliases: [site_num, site_count, sites, 试点数, 试点, 试验地点数, 地点数, 地点]
    patterns:
      - '(?:site_num|site_count|sites?|试点数|试验地点数|地点数|地点|试点)\s*[:：=]?\s*(\d+)'
      - '(\d+)\s*(?:个|处)?(?:试点|试验地点|地点|site|sites)'
      - '做\s*(\d+)\s*(?:次|套|个试点|个地点)'
      - '生成\s*(\d+)\s*套'
      - '(\d+)\s*套(?:不一样|不同|独立)?'
    validation:
      min: 1
      max: 50
  site_names:
    type: string
    required: false
    title: 试点名称
    question: 如果需要指定试点名称，请按顺序提供名称，例如：公主岭市、榆树市、农安县。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [site_names, site_labels, site_name_list, 试点名称, 试验地点名称, 地点名称]
  planter:
    type: string
    required: false
    title: 播种路径
    question: 播种路径可选 serpentine 或 cartesian，默认 serpentine。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    default: serpentine
    enum: [serpentine, cartesian]
    aliases: [planter, planting_path, 播种路径, 走向]
    patterns:
      - '(?i)(serpentine|cartesian)'
      - '蛇形|往返'
      - '笛卡尔|逐行'
  seed:
    type: integer
    required: false
    title: 随机种子
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [seed, random_seed, 随机种子]
    patterns:
      - '(?:seed|random_seed|随机种子)\s*[:：=]?\s*(\d+)'
    validation:
      min: 1
  run_id:
    type: string
    required: false
    title: 运行名称
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [run_id, run-id, 运行名称, 任务名]
constraints:
  - any_of: [material_data, input_data, material_names]
