schema_id: interval
title: 间比法设计
inputs:
  design: {type: string, required: true, const: interval, aliases: [interval, 间比法]}

  material_data: {type: artifact, required: true, source: {allowed: [artifact]}, aliases: [材料清单, material_data]}
  blocks: {type: integer, required: false, aliases: [blocks, 区组数, 重复数, 重复], validation: {min: 1, max: 100}}
  ncols: {type: integer, required: false, aliases: [ncols, 列数, 田块列数], validation: {min: 1, max: 1000}}
  ck_ratio: {type: string, required: false, default: A}
  planter: {type: string, required: false, default: serpentine}
  randomize: {type: string, required: false, default: 'true'}
  seed: {type: integer, required: false}
  run_id: {type: string, required: false}
  ck_spec: {type: string, required: true, aliases: [ck_spec, CK参数, CK间隔], reference_resource: interval}
