schema_id: interval
version: 1.0.0
title: Interval contrast design input
description: 间比法试验设计输入，要求提供材料清单、田块列数 ncols，并在识别 CK 后补充 CK 起始位置和间隔数量；材料清单可使用中文或英文表头。
activation:
  aliases:
    - interval
    - 间比
    - 间比法
    - interval contrast
inputs:
  material_data:
    type: artifact
    required: false
    title: 材料清单
    question: 请上传或提供材料清单文件。表头和列顺序不固定，只需包含材料名称/代号、是否对照、组别/分组等必要信息列。
    source:
      allowed:
        - artifact
        - upload
        - task_attachment
        - upload_ledger
        - metadata
    aliases:
      - material_data
      - material_file
      - input_file
      - 材料清单
      - 材料表
    validation:
      file_extensions: [.csv, .xls, .xlsx]
  input_data:
    type: string
    required: false
    title: 粘贴的材料表
    question: 如果没有文件，也可以直接粘贴 CSV 格式材料表；表头可用材料、品种、ped_id、是否对照、组别等语义相近名称。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases:
      - input_data
      - pasted_material_data
      - pasted_data
      - 材料表
  design:
    type: string
    required: true
    title: 设计类型
    question: 设计类型已选择为 Interval。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    const: interval
    enum: [interval]
    aliases: [design, design_type, 设计类型, 试验设计, 间比法]
    patterns:
      - '(?i)\b(interval|interval contrast)\b'
      - '间比|间比法'
  design_label:
    type: string
    required: false
    title: 设计标识
    question: 可选。用于输出文件命名和区分不同轮次设计，例如 黄淮海。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases:
      - design_label
      - design_name
      - trial_label
      - trial_name
      - project_label
      - project_name
      - output_label
      - region
      - area
      - 设计标识
      - 设计名称
      - 试验名称
      - 项目名称
      - 输出标识
      - 区域
    patterns:
      - '(?:设计标识|设计名称|试验名称|项目名称|输出标识|区域|region|area|design_label|project_name)\s*[:：=]\s*([A-Za-z0-9_.\-\u4e00-\u9fff]{2,40})'
  ncols:
    type: integer
    required: true
    title: 田块列数
    question: 请提供田块列数 ncols，例如 ncols=10 或列数10。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [ncols, columns, field_columns, 列数, 田块列数]
    patterns:
      - '(?:ncols|columns?|列数|田块列数)\s*[:：=]?\s*(\d+)'
      - '(\d+)\s*(?:列|columns?)'
    validation:
      min: 1
  ck_spec:
    type: string
    required: false
    title: 对照位置约束
    question: 这是间比法设计中的 CK 对照位置约束，不是品种规格。识别 CK 后，请下载对照位置参数清单，补充“起始位置”和“间隔数量”两列后上传 CSV 或 Excel。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases:
      - ck_spec
      - ck-spec
      - 对照位置约束
      - CK位置约束
      - CK起始位置
      - CK间隔
      - CK布局参数
      - CK参数
      - 对照布局
      - 起始位置
      - 间隔数量
  ck_spec_file:
    type: artifact
    required: false
    title: 对照位置参数清单
    question: 请上传补好“起始位置”和“间隔数量”的对照位置参数清单，支持 CSV、XLS 或 XLSX。
    source:
      allowed:
        - artifact
        - upload
        - task_attachment
        - upload_ledger
        - metadata
    aliases:
      - ck_spec_file
      - ck_params_file
      - ck_position_file
      - 对照位置参数清单
      - 对照位置约束表
      - CK参数表
    validation:
      file_extensions: [.csv, .xls, .xlsx]
  site_num:
    type: integer
    required: false
    title: 试验地点数
    question: 如果需要多个试点/试验地点，请提供地点数；默认 1 个地点。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    default: 1
    aliases: [site_num, site_count, sites, 试点数, 试点, 试验地点数, 地点数, 地点]
    patterns:
      - '(?:site_num|site_count|sites?|试点数|试验地点数|地点数|地点|试点)\s*[:：=]?\s*(\d+)'
      - '(\d+)\s*(?:个|处)?(?:试点|试验地点|地点|site|sites)'
      - '做\s*(\d+)\s*(?:次|套|个试点|个地点)'
      - '生成\s*(\d+)\s*套'
      - '(\d+)\s*套(?:不一样|不同|独立)?'
    validation:
      min: 1
      max: 50
  site_names:
    type: string
    required: false
    title: 试点名称
    question: 如果需要指定试点名称，请按顺序提供名称，例如：公主岭市、榆树市、农安县。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [site_names, site_labels, site_name_list, 试点名称, 试验地点名称, 地点名称]
  planter:
    type: string
    required: false
    title: 播种路径
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    default: serpentine
    enum: [serpentine, cartesian]
    aliases: [planter, planting_path, 播种路径, 走向]
    patterns:
      - '(?i)(serpentine|cartesian)'
      - '蛇形|往返'
      - '笛卡尔|逐行'
  randomize:
    type: boolean
    required: false
    title: 是否随机化
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    default: true
    aliases: [randomize, randomise, 随机化, 打乱]
    patterns:
      - '(?:randomi[sz]e|随机化|打乱)\s*[:：=]?\s*(true|false|yes|no|是|否)'
  seed:
    type: integer
    required: false
    title: 随机种子
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [seed, random_seed, 随机种子]
    patterns:
      - '(?:seed|random_seed|随机种子)\s*[:：=]?\s*(\d+)'
    validation:
      min: 1
  run_id:
    type: string
    required: false
    title: 运行名称
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [run_id, run-id, 运行名称, 任务名]
constraints:
  - any_of: [material_data, input_data]
