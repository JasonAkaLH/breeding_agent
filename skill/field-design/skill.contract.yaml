contract_version: '2'
capability:
  id: skill.field_design
  display_name: 试验设计智能体
  description: 根据材料清单生成 RCBD、对角线增广或间比法田间试验设计，输出 fieldbook 和田间布局预览。
  version: 1.0.0
routing:
  triggers:
    - 试验设计
    - 田间试验设计
    - 随机区组试验设计
    - 随机完全区组试验设计
    - RCBD设计
    - RCBD
    - 对角线增广设计
    - 对角线设计
    - diagonal augmented design
    - 间比法试验设计
    - 间比法设计
    - fieldbook
    - 田间记录本
    - 播种顺序
    - 小区布局
    - field design
    - randomized complete block design
    - interval contrast design
  intent_aliases:
    - /field-design
    - $field-design
    - $mini-field-design
  examples:
    - /field-design 用这个 CSV 做 RCBD，3 个重复
    - /field-design 做对角线增广设计，ncols=20
    - /field-design 间比法设计，列数10，先识别 CK
runtime:
  mode: python_subprocess
  answer_mode: requires_finalizer
entrypoints:
  run:
    path: scripts/run_field_design.py
    input_schema: rcbd
    output: design_output
    timeout_seconds: 300
input_schemas:
  rcbd:
    path: schemas/rcbd.input.yaml
    title: RCBD design input
    description: Material list and block count for randomized complete block design.
    aliases:
      - rcbd
      - RCBD
      - 随机区组
      - 随机完全区组
      - 完全随机区组
      - randomized complete block
  diagonal:
    path: schemas/diagonal.input.yaml
    title: Diagonal augmented design input
    description: Material list and field column count for diagonal augmented design.
    aliases:
      - diagonal
      - 对角线
      - 对角线增广
      - 对角线设计
      - diagonal augmented
  interval:
    path: schemas/interval.input.yaml
    title: Interval contrast design input
    description: Material list, field column count, and CK placement parameters for interval contrast design.
    aliases:
      - interval
      - 间比
      - 间比法
      - 间比法设计
      - interval contrast
schema_selector:
  field: design
  default: rcbd
  choices:
    rcbd:
      schema: rcbd
      patterns:
        - '(?i)\b(rcbd|randomi[sz]ed complete block)\b'
        - '随机(?:完全)?区组|完全随机区组'
    diagonal:
      schema: diagonal
      patterns:
        - '(?i)\b(diagonal|diagonal augmented)\b'
        - '对角线|增广'
    interval:
      schema: interval
      patterns:
        - '(?i)\b(interval|interval contrast)\b'
        - '间比|间比法'
outputs:
  design_output:
    required:
      - answer
    artifacts:
      - extensions: [.csv]
        mime_types: [text/csv]
      - extensions: [.html]
        mime_types: [text/html]
resources:
  material_format:
    path: references/material-format.md
    title: Material list format
    description: User-visible material table columns and validation notes.
    audience: [main_agent]
  workflows:
    path: references/workflows.md
    title: Field design workflows
    description: User-facing RCBD, Diagonal, and Interval workflow guidance.
    audience: [main_agent]
  service_boundary:
    path: references/service-boundary.md
    title: Service boundary
    description: Runtime ownership and output responsibilities.
    audience: [main_agent]
resource_policy:
  default_audience: [main_agent]
  max_bytes: 12000
