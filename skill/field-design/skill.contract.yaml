contract_version: '2'
capability:
  id: skill.field_design
  display_name: 田间试验设计
  description: 基于 CSV/Excel 材料清单生成随机区组、对角线增广或间比法田间试验设计。
routing:
  triggers: [field design, 田间设计, 田间试验设计, fieldbook, 田间布局, 随机区组, 对角线增广, 间比法]
  examples: [/field-design 用这个 CSV 做 RCBD，3 个重复, /field-design 生成间比法设计 ck_spec=A,1,10]
runtime:
  mode: python_subprocess
  answer_mode: requires_finalizer
entrypoints:
  run:
    path: scripts/run_field_design.py
    input_schema: rcbd
    output: design_output
    timeout_seconds: 300
input_schemas:
  rcbd: {path: schemas/rcbd.input.yaml, title: 随机区组设计, description: RCBD 不要求 ck_spec, aliases: [rcbd, RCBD, 随机区组, 随机完全区组], entrypoint: run}
  diagonal: {path: schemas/diagonal.input.yaml, title: 对角线增广设计, aliases: [diagonal, Diagonal, 对角线, 对角线增广], entrypoint: run}
  interval: {path: schemas/interval.input.yaml, title: 间比法设计, description: Interval 需要 ncols 和 ck_spec, aliases: [interval, Interval, 间比法, 间比], entrypoint: run}
schema_selector: {strategy: deterministic_then_llm, selector_field: design, min_confidence: 0.8}
outputs:
  design_output:
    required: [answer]
    artifacts:
      - {extensions: [.csv], mime_types: [text/csv]}
      - {extensions: [.html], mime_types: [text/html]}
resources:
  usage: {path: references/usage.md, title: 用法说明, audience: [main_agent, slot_question]}
  material_data: {path: references/material-data.md, title: 材料表字段, audience: [main_agent, slot_question]}
  rcbd: {path: references/rcbd.md, title: 随机区组, audience: [main_agent, slot_question]}
  diagonal: {path: references/diagonal.md, title: 对角线增广, audience: [main_agent, slot_question]}
  interval: {path: references/interval.md, title: 间比法 CK 参数, audience: [main_agent, slot_question]}
