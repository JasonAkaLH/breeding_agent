contract_version: '2'
capability: {id: skill.ocr, display_name: OCR 识别, description: 调用受控 OCR 流程识别图片或 PDF 文本。}
routing: {triggers: [ocr, OCR, 识别图片, PDF识别], examples: [/ocr 识别这张图片, /ocr 输出 JSON]}
runtime: {mode: python_subprocess, answer_mode: requires_finalizer}
entrypoints:
  run: {path: scripts/run_ocr.py, input_schema: document_ocr, output: ocr_output, timeout_seconds: 3900}
input_schemas:
  document_ocr: {path: schemas/document-ocr.input.yaml, title: OCR 输入, aliases: [ocr, OCR, 图片识别, PDF识别], entrypoint: run}
outputs:
  ocr_output: {required: [answer]}
resources:
  usage: {path: references/usage.md, title: 用法说明, audience: [main_agent, slot_question]}
  supported_files: {path: references/supported-files.md, title: 支持文件, audience: [main_agent, slot_question]}
  output_formats: {path: references/output-formats.md, title: 输出格式, audience: [main_agent, slot_question]}
