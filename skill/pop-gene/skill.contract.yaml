contract_version: '2'
capability:
  id: skill.pop_gene
  display_name: 群体遗传分析智能体
  description: 对育种基因型数据进行 PCA、ADMIXTURE、遗传距离、PCoA 和系统发育树分析，并生成中文解读。
  version: 1.0.0
routing:
  triggers:
    - 群体遗传分析
    - 基因型分析
    - 群体结构
    - PCA 分析
    - ADMIXTURE
    - 遗传距离
    - PCoA
    - 系统发育树
    - 进化树
    - BIONJ
    - UPGMA
    - pop gene
    - population genetics
    - genotype analysis
  intent_aliases:
    - /pop-gene
    - $pop-gene
  examples:
    - /pop-gene analyze this HapMap file
    - $pop-gene 用这个 VCF 做 PCA
    - 用基因型数据跑 ADMIXTURE，K=2 到 K=6
runtime:
  mode: python_subprocess
  answer_mode: direct
entrypoints:
  run:
    path: scripts/run_pop_gene.py
    input_schema: pop_gene
    output: pop_gene_output
    timeout_seconds: 900
input_schemas:
  pop_gene:
    path: schemas/pop-gene.input.yaml
    title: Population genetics input
    description: Genotype file and requested population genetics workflow.
    aliases:
      - pop-gene
      - population genetics
      - genotype analysis
      - 群体遗传分析
      - 基因型分析
      - PCA
      - ADMIXTURE
outputs:
  pop_gene_output:
    required:
      - answer
    artifacts:
      - extensions: [.html]
        mime_types: [text/html]
resources:
  data_format:
    path: references/data-format.md
    title: Genotype data formats
    description: Accepted genotype input formats and format inference rules.
    audience: [main_agent]
  workflows:
    path: references/workflows.md
    title: Population genetics workflows
    description: Analysis workflow defaults, API sequence, and interpretation checkpoints.
    audience: [main_agent]
  output_policy:
    path: references/output-policy.md
    title: Output policy
    description: Runtime artifact ownership, skill output directory, and report/session layout.
    audience: [main_agent]
resource_policy:
  default_audience: [main_agent]
  max_bytes: 12000
