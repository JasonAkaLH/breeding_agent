contract_version: '2'
capability:
  id: skill.plant_dis
  display_name: PlantDis 病害识别智能体
  description: 根据玉米或水稻叶片图片识别当前支持的病害类别，并生成中文辅助判断结果。
  version: 0.1.0
routing:
  triggers:
    - PlantDis
    - plant-dis
    - 病害识别
    - 病害检测
    - 植物病害识别
    - 叶片病害识别
    - 玉米病害识别
    - 水稻病害识别
    - maize disease
    - rice disease
    - plant disease
  intent_aliases:
    - /plant-dis
    - $plant-dis
  examples:
    - /plant-dis 识别这张玉米叶片病害图片
    - $plant-dis 水稻图片，帮我检测病害
    - 帮我看一下这张叶片图是不是稻瘟病
runtime:
  mode: python_subprocess
  answer_mode: direct
entrypoints:
  run:
    path: scripts/run_plant_dis.py
    input_schema: plant_dis
    output: plant_dis_output
    timeout_seconds: 180
input_schemas:
  plant_dis:
    path: schemas/plant-dis.input.yaml
    title: PlantDis image input
    description: Crop disease recognition input for maize or rice leaf images.
    aliases:
      - plant-dis
      - PlantDis
      - 病害识别
      - 玉米病害识别
      - 水稻病害识别
outputs:
  plant_dis_output:
    required:
      - answer
    artifacts: []
resources:
  usage_boundary:
    path: references/usage-boundary.md
    title: PlantDis usage boundary
    description: User-visible entrypoint, required crop declaration, missing-input behavior, and scope limits.
    audience: [main_agent]
  api_usage:
    path: references/api-usage.md
    title: PlantDis API usage
    description: User-safe supported labels, result interpretation, and error-handling guidance.
    audience: [main_agent]
resource_policy:
  default_audience: [main_agent]
  max_bytes: 12000
