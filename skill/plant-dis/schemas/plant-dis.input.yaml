schema_id: plant_dis
version: 0.1.0
title: PlantDis image input
description: 玉米或水稻叶片病害识别输入。
activation:
  aliases:
    - plant-dis
    - PlantDis
    - 病害识别
    - 病害检测
    - 玉米病害识别
    - 水稻病害识别
inputs:
  image_file:
    type: artifact
    required: true
    title: 叶片图片
    question: 请在当前会话上传一张玉米或水稻叶片图片，或使用相机拍照后提交，并明确说明作物类型是玉米还是水稻。
    source:
      allowed:
        - artifact
        - upload
        - task_attachment
        - upload_ledger
        - metadata
    aliases: [image_file, file, image, photo, camera_photo, picture, 图片, 照片, 拍照, 相机照片, 叶片图片, 病害图片]
    validation:
      file_extensions: [.jpg, .jpeg, .png, .webp, .bmp]
  crop:
    type: string
    required: true
    title: 作物类型
    question: 这张图片是玉米还是水稻？当前不支持从图片自动识别作物类型，请明确指定。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    enum: [maize, rice]
    aliases: [crop, species, 作物, 作物类型, 玉米, 水稻, maize, corn, rice]
    patterns:
      - '(?i)\b(maize|corn)\b'
      - '(?i)\brice\b'
      - '玉米'
      - '水稻|稻'
  confidence:
    type: number
    required: false
    title: 水稻检测置信度阈值
    question: 水稻检测可选置信度阈值，默认 0.25。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    default: 0.25
    aliases: [confidence, conf, 置信度, 阈值]
    patterns:
      - '(?:confidence|conf|置信度|阈值)\s*[:：=]?\s*(0(?:\.\d+)?|1(?:\.0+)?)'
    validation:
      min: 0
      max: 1
  iou:
    type: number
    required: false
    title: 水稻检测 IoU 阈值
    question: 水稻检测可选 NMS IoU 阈值，默认 0.45。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    default: 0.45
    aliases: [iou, IoU, NMS, nms_iou]
    patterns:
      - '(?:iou|IoU|NMS|nms_iou)\s*[:：=]?\s*(0(?:\.\d+)?|1(?:\.0+)?)'
    validation:
      min: 0
      max: 1
