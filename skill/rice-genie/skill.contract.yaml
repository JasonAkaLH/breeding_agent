contract_version: '2'
capability: {id: skill.rice_genie, display_name: RiceGenie 水稻体检, description: 分析水稻 VCF/VCF.GZ 或 gene_check JSON 并生成 QTN 报告。}
routing: {triggers: [rice-genie, rice qtn gene check, 水稻体检, 水稻基因型体检, 基因型体检, 优良变异, QTN, qtn, VCF, vcf], examples: [/rice-genie 分析这个 VCF]}
runtime: {mode: python_subprocess, answer_mode: requires_finalizer}
entrypoints: {run: {path: scripts/run_rice_genie.py, input_schema: qtn_check, output: rice_output, timeout_seconds: 300}}
input_schemas:
  qtn_check: {path: schemas/qtn-check.input.yaml, title: VCF QTN 检查, aliases: [vcf, VCF, vcf.gz, qtn], entrypoint: run}
  report_from_gene_check: {path: schemas/report-from-gene-check.input.yaml, title: gene_check 报告, aliases: [gene_check, json, 基因检测结果], entrypoint: run}
schema_selector: {strategy: deterministic_then_llm, selector_field: rice_input_type}
outputs:
  rice_output: {required: [answer], artifacts: [{extensions: [.md], mime_types: [text/markdown]}]}
resources:
  usage: {path: references/usage.md, title: 用法说明, audience: [main_agent, slot_question]}
  vcf_input: {path: references/vcf-input.md, title: VCF 输入, audience: [main_agent, slot_question]}
  gene_check_json: {path: references/gene-check-json.md, title: gene_check JSON, audience: [main_agent, slot_question]}
