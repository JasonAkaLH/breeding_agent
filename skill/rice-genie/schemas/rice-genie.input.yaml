schema_id: rice_genie
version: 1.0.0
title: Rice Genie input
description: 水稻 VCF、VCF.GZ 或已有 gene-check JSON 的 QTN 匹配和体检解读输入。
activation:
  aliases:
    - rice genie
    - RiceGenie
    - 水稻体检
    - 水稻VCF
    - QTN匹配
inputs:
  rice_input:
    type: artifact
    required: true
    title: 水稻基因型输入
    question: 请上传水稻 VCF、VCF.GZ 或已有 gene-check JSON 文件。
    source:
      allowed:
        - artifact
        - upload
        - task_attachment
        - upload_ledger
        - metadata
    aliases: [rice_input, vcf, input_file, gene_check, 水稻VCF, 基因体检结果]
    validation:
      file_extensions: [.vcf, .vcf.gz, .gz, .json]
  file_path:
    type: string
    required: false
    title: 输入文件路径
    question: 也可以提供本地 VCF 或 gene-check JSON 文件路径。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [file_path, path, input_path, vcf_path, 文件路径]
  sample:
    type: string
    required: false
    title: 单个样本
    question: 如需只解读某个样本，请提供样本 ID。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [sample, sample_id, 样本, 样本ID]
    patterns:
      - '(?:sample|sample_id|样本|样本ID)\s*[:：=]?\s*([A-Za-z0-9_.-]+)'
  samples:
    type: string
    required: false
    title: 多个样本
    question: 如需解读多个样本，请用逗号、分号或空格分隔样本 ID。
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [samples, sample_ids, 样本列表, 多个样本]
    patterns:
      - '(?:samples|sample_ids|样本列表|多个样本)\s*[:：=]\s*([A-Za-z0-9_.;,；，\-\s]+)'
  run_id:
    type: string
    required: false
    title: 运行名称
    source:
      allowed:
        - query
        - current_user_message
        - resolved_user_message
        - recent_user_message
        - text
        - user_text
        - metadata
    aliases: [run_id, out_prefix, out-prefix, 运行名称, 任务名]
constraints:
  - any_of: [rice_input, file_path]
