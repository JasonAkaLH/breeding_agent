schema_version: '1'
schema_id: list_fields
title: 查询种质扩展字段
description: 查询当前租户下种质信息可用于扩展字段检索的字段定义。
inputs:
  query:
    type: string
    required: false
    title: 用户问题
    description: 用户关于扩展字段或 searchFieldData 的自然语言问题。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [问题, 查询]
    patterns:
      - '.*扩展字段.*'
      - '.*字段.*'
      - '.*searchFieldData.*'
slot_policy:
  max_rounds: 1
entrypoint_mapping: run
