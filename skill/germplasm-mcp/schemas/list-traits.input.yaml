schema_version: '1'
schema_id: list_traits
title: 查询作物性状
description: 根据作物 ID 查询可用于种质检索的性状编码和类型。
inputs:
  cropId:
    type: integer
    required: true
    title: 作物 ID
    question: 请提供作物 ID；如果只有作物名称，我可以先查询作物列表帮你匹配。
    description: MCP tool `germ_query_org_crop_traits` 需要的作物 ID。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [作物ID, crop id, cropId]
    patterns:
      - '.*作物\s*ID\s*[:：]?\s*(\d+).*'
      - '.*cropId\s*[:=：]?\s*(\d+).*'
      - '.*crop\s*id\s*[:=：]?\s*(\d+).*'
    validation:
      min: 1
      message: 作物 ID 必须是正整数。
  cropName:
    type: string
    required: false
    title: 作物名称
    description: 用户只提供作物名称时，先用作物列表查询匹配 cropId。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [作物名称, crop name]
slot_policy:
  max_rounds: 2
entrypoint_mapping: run
