schema_version: '1'
schema_id: germ_search
title: 搜索种质资源
description: 使用 germ_search 按作物、种质名称、动态性状和扩展字段分页搜索种质信息。
inputs:
  cropId:
    type: string
    required: false
    default: ''
    title: 作物 ID
    description: 作物 ID；不按作物过滤时传空字符串。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [作物ID, crop id, cropId]
    patterns:
      - '.*作物\s*ID\s*[:：]?\s*(\d+).*'
      - '.*cropId\s*[:=：]?\s*(\d+).*'
  pageNum:
    type: integer
    required: false
    default: 1
    title: 页码
    description: 页码，从 1 开始。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [页码, pageNum, page]
    patterns:
      - '.*第\s*(\d+)\s*页.*'
      - '.*page\s*[:=：]?\s*(\d+).*'
    validation:
      min: 1
      max: 100000
  pageSize:
    type: integer
    required: false
    default: 10
    title: 每页数量
    description: 每页数量，默认 10，最大 100。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [每页数量, pageSize, limit]
    patterns:
      - '.*每页\s*(\d+)\s*条.*'
      - '.*pageSize\s*[:=：]?\s*(\d+).*'
      - '.*limit\s*[:=：]?\s*(\d+).*'
    validation:
      min: 1
      max: 100
  germNamesList:
    type: string
    required: false
    default: '[]'
    title: 种质名称列表 JSON 字符串
    description: 精确搜索的种质名称 JSON 数组字符串；不按名称过滤时传 []。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [种质名称, germNamesList, germ name]
  searchTraitData:
    type: string
    required: false
    default: '[]'
    title: 性状定义 JSON 数组字符串
    description: 动态性状定义 JSON 数组字符串；traitCode 必须来自作物性状查询；不按性状过滤时传 []。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [性状定义, searchTraitData, traitCode]
  traitValueData:
    type: string
    required: false
    default: '{}'
    title: 性状值 JSON 对象字符串
    description: 动态性状查询值 JSON 对象字符串；不按性状过滤时传 {}。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [性状值, traitValueData]
  searchFieldData:
    type: string
    required: false
    default: '[]'
    title: 扩展字段查询 JSON 数组字符串
    description: 动态扩展字段查询 JSON 数组字符串；key 必须来自扩展字段查询；不按扩展字段过滤时传 []。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [扩展字段, searchFieldData, 字段筛选]
  naturalLanguageQuery:
    type: string
    required: false
    title: 自然语言检索目标
    description: 用户原始检索目标；当复杂条件尚未结构化时，先用此字段理解意图，再按 references/search-examples.md 组装 MCP 参数。
    source:
      allowed: [query, current_user_message, resolved_user_message, recent_user_message, text]
    aliases: [查询目标, 检索目标, 条件]
slot_policy:
  max_rounds: 3
entrypoint_mapping: run
