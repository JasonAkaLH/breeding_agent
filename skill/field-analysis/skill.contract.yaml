contract_version: '2'
capability: {id: skill.field_analysis, display_name: 田间数据分析, description: 分析随机区组或对角线增广田间表型数据并生成报告。}
routing: {triggers: [field-analysis, field trial analysis, phenotype, LSD, lsd, 田间分析, 田间数据分析, 表型分析, 随机区组分析, 对角线增广分析], examples: [/field-analysis 分析这个 RCBD 表型数据]}
runtime: {mode: python_subprocess, answer_mode: requires_finalizer}
entrypoints: {run: {path: scripts/run_field_analysis.py, input_schema: rcbd_analysis, output: analysis_output, timeout_seconds: 300}}
input_schemas:
  rcbd_analysis: {path: schemas/rcbd-analysis.input.yaml, title: RCBD 分析, aliases: [rcbd, 随机区组], entrypoint: run}
  diagonal_analysis: {path: schemas/diagonal-analysis.input.yaml, title: 对角线增广分析, aliases: [diagonal, 对角线], entrypoint: run}
schema_selector: {strategy: deterministic_then_llm, selector_field: design}
outputs:
  analysis_output: {required: [answer], artifacts: [{extensions: [.json], mime_types: [application/json]}]}
resources:
  usage: {path: references/usage.md, title: 用法说明, audience: [main_agent, slot_question]}
  field_data: {path: references/field-data.md, title: 田间数据字段, audience: [main_agent, slot_question]}
  report_structure: {path: references/report-structure.md, title: 报告结构, audience: [main_agent, slot_question]}
