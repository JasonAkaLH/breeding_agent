services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: breeding-agent-backend:local
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      MAF_RUST_CORE_MODE: "off"
      MAF_RUST_LIFECYCLE_MODE: "off"
      MAF_RUST_ARTIFACT_STORE_MODE: "off"
      MAF_RUST_AUTH_CORE_MODE: "off"
      MAF_RUST_DATA_ACCESS_MODE: "off"
      MAF_RUST_AUDIT_SANITIZER_MODE: "off"
      MAF_RUST_SKILL_RUNTIME_MODE: "off"
      MCP_USER_SCOPED_GATEWAY_ENABLED: "${MCP_USER_SCOPED_GATEWAY_ENABLED:-false}"
      MCP_ROUTING_MODE: "${MCP_ROUTING_MODE:-off}"
      MCP_LEGACY_GLOBAL_RUNTIME_ENABLED: "${MCP_LEGACY_GLOBAL_RUNTIME_ENABLED:-true}"
      MCP_ENFORCE_COHORTS: "${MCP_ENFORCE_COHORTS:-}"
      MCP_ENFORCE_PERCENT: "${MCP_ENFORCE_PERCENT:-0}"
      MCP_ENFORCE_HASH_SALT: "${MCP_ENFORCE_HASH_SALT:-}"
      MCP_ENFORCE_COHORT_CONFIG_FILE: "${MCP_ENFORCE_COHORT_CONFIG_FILE:-}"
    volumes:
      - breeding-agent-runtime:/app/runtime
      - /data/peihai/vibe-breeding-dev/skills:/app/skill:ro
    ports:
      - "51888:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api-doc"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_APP_BASE_PATH: /seedpilot/
        VITE_API_BASE_URL: /seedpilot
    image: breeding-agent-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "51999:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/seedpilot/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  breeding-agent-runtime:
