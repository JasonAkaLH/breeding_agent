services:
  runtime-sidecar:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-sidecar
    image: breeding-agent-runtime-sidecar:local
    volumes:
      - breeding-agent-runtime-sidecar-socket:/run/maf-runtime-sidecar
      - breeding-agent-runtime-sidecar-data:/var/lib/maf-runtime-sidecar
    healthcheck:
      test: ["CMD", "/usr/local/bin/maf-runtime-sidecar", "--probe", "unix:///run/maf-runtime-sidecar/runtime.sock"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6

  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: breeding-agent-backend:local
    depends_on:
      runtime-sidecar:
        condition: service_healthy
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      MAF_API_ENV: "dev"
      MAF_STATE_STORE_BACKEND: "sqlite"
      MAF_STATE_PLATFORM_CONFIG_BRIDGE: "0"
      MAF_RUNTIME_SIDECAR_ENDPOINT: "unix:///run/maf-runtime-sidecar/runtime.sock"
      MAF_RUST_RUNTIME_STORE_MODE: "off"
      MAF_RUST_EVENT_LOG_MODE: "off"
      MAF_RUST_TASK_DISPATCHER_MODE: "off"
      MAF_RUST_CORE_MODE: "off"
      MAF_RUST_LIFECYCLE_MODE: "off"
      MAF_RUST_ARTIFACT_STORE_MODE: "off"
      MAF_RUST_AUTH_CORE_MODE: "off"
      MAF_RUST_DATA_ACCESS_MODE: "off"
      MAF_RUST_AUDIT_SANITIZER_MODE: "off"
      MAF_RUST_SKILL_RUNTIME_MODE: "off"
      MAF_USER_MCP_MAX_ACTIVE_CALLS: "8"
      MAF_USER_MCP_TEMPORARY_DISK_LOW_WATERMARK_BYTES: "1048576"
      MAF_MASTER_KEY_FILE: "/run/secrets/maf-master.key"
      MCP_USER_SCOPED_GATEWAY_ENABLED: "true"
      MCP_ROUTING_MODE: "enforce"
      MCP_LEGACY_GLOBAL_RUNTIME_ENABLED: "false"
      MCP_ENFORCE_COHORTS: ""
      MCP_ENFORCE_PERCENT: "100"
      MCP_ENFORCE_HASH_SALT: "main-cp7a-user-scoped-v1"
      MCP_ENFORCE_COHORT_CONFIG_FILE: ""
    volumes:
      - breeding-agent-runtime:/app/runtime
      - breeding-agent-runtime-sidecar-socket:/run/maf-runtime-sidecar:ro
      - ${MAF_MASTER_KEY_FILE_HOST:?MAF_MASTER_KEY_FILE_HOST is required}:/run/secrets/maf-master.key:ro
      - /data/peihai/vibe-breeding-dev/skills:/app/skill:ro
    ports:
      - "51888:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api-doc"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_APP_BASE_PATH: /seedpilot/
        VITE_API_BASE_URL: /seedpilot
    image: breeding-agent-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "51999:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/seedpilot/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  breeding-agent-runtime:
  breeding-agent-runtime-sidecar-socket:
  breeding-agent-runtime-sidecar-data:
