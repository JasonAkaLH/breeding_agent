[workspace]
members = ["crates/maf_core_types", "crates/maf_lifecycle", "crates/maf_core_lifecycle_pyo3", "crates/maf_runtime_store", "crates/maf_event_log", "crates/maf_task_dispatcher", "crates/maf_runtime_sidecar", "crates/maf_skill_runtime", "crates/maf_skill_runtime_pyo3", "crates/maf_artifact_store", "crates/maf_auth_core", "crates/maf_data_access", "crates/maf_audit_sanitizer", "crates/maf_safety_kernels_pyo3", "crates/maf_mcp_runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
repository = "https://example.invalid/multi_agent_framework"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
prost = "0.14.3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic-prost-build = "0.14.6"
protoc-bin-vendored = "3.2.0"
pyo3 = "0.28.3"
pyo3-build-config = "0.28.3"
