[package]
name = "maf_fuzz_targets"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
maf_artifact_store = { path = "../crates/maf_artifact_store" }
maf_audit_sanitizer = { path = "../crates/maf_audit_sanitizer" }
maf_auth_core = { path = "../crates/maf_auth_core" }
maf_data_access = { path = "../crates/maf_data_access" }
maf_mcp_runtime = { path = "../crates/maf_mcp_runtime" }
maf_skill_runtime = { path = "../crates/maf_skill_runtime" }
rmcp = { version = "=1.7.0", default-features = false }
serde_json = "1"

[[bin]]
name = "skill_runtime_policy"
path = "fuzz_targets/skill_runtime_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_runtime_protocol"
path = "fuzz_targets/mcp_runtime_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "artifact_path"
path = "fuzz_targets/artifact_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit_sanitizer"
path = "fuzz_targets/audit_sanitizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auth_core"
path = "fuzz_targets/auth_core.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_access_readonly"
path = "fuzz_targets/data_access_readonly.rs"
test = false
doc = false
bench = false

[workspace]
