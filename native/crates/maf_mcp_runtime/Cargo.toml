[package]
name = "maf_mcp_runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "maf-mcp-runtime-sidecar"
path = "src/main.rs"

[[bin]]
name = "export-mcp-runtime-contract"
path = "src/bin/export_mcp_runtime_contract.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
http.workspace = true
rmcp.workspace = true
tokio.workspace = true

[features]
default = []
# PRD-3 official Rust SDK adapter feature marker. The rmcp dependency is
# linked with client/Streamable HTTP features only and must not expand the
# product-approved MCP protocol version set.
official-rust-sdk-adapter = []
