syntax = "proto3";

package maf.skill.v1;

import "maf/common/v1/common.proto";

service SkillSandbox {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Readiness(ReadinessRequest) returns (ReadinessResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc CheckCompatibility(CompatibilityCheckRequest) returns (CompatibilityCheckResponse);
  rpc ValidatePolicy(ValidatePolicyRequest) returns (ValidatePolicyResponse);
  rpc ExecuteSandboxed(ExecuteSandboxedRequest) returns (ExecuteSandboxedResponse);
}

message HealthRequest {}
message ReadinessRequest {}
message VersionRequest {}

message HealthResponse {
  maf.common.v1.HealthState state = 1;
  maf.common.v1.VersionInfo version = 2;
  maf.common.v1.TypedError error = 3;
}

message ReadinessResponse {
  maf.common.v1.ReadinessState state = 1;
  maf.common.v1.VersionInfo version = 2;
  bool compatibility_handshake_passed = 3;
  maf.common.v1.TypedError error = 4;
}

message VersionResponse {
  maf.common.v1.VersionInfo version = 1;
}

message CompatibilityCheckRequest {
  string client_version = 1;
  string expected_component = 2;
  string expected_protocol_version = 3;
  string expected_schema_hash = 4;
  string expected_error_code_table_hash = 5;
  repeated string required_features = 6;
}

message CompatibilityCheckResponse {
  bool compatible = 1;
  maf.common.v1.VersionInfo version = 2;
  repeated string missing_features = 3;
  maf.common.v1.TypedError error = 4;
}

message ValidatePolicyRequest {
  string skill_name = 1;
  string capability_id = 2;
  string execution_mode = 3;
  string trust_scope = 4;
  string handler = 5;
  repeated string manifest_services = 6;
  repeated string runtime_allowlist_services = 7;
  map<string, string> x_runtime_rust = 8;
  repeated string runtime_allowlist_handlers = 9;
  repeated string requested_services = 10;
}

message ValidatePolicyResponse {
  bool allowed = 1;
  string bundle_fingerprint = 2;
  maf.common.v1.TypedError error = 3;
}

message ExecuteSandboxedRequest {
  string skill_name = 1;
  string execution_mode = 2;
  string cwd_under_public_root = 3;
  uint32 timeout_ms = 4;
  uint32 stdout_limit_bytes = 5;
  uint32 stderr_limit_bytes = 6;
  bytes stdin_payload = 7;
  repeated string argv = 8;
}

message ExecuteSandboxedResponse {
  int32 exit_code = 1;
  bytes stdout_prefix = 2;
  bytes stderr_prefix = 3;
  bool stdout_truncated = 4;
  bool stderr_truncated = 5;
  maf.common.v1.TypedError error = 6;
}
