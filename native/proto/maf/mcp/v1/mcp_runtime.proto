syntax = "proto3";

package maf.mcp.v1;

import "maf/common/v1/common.proto";

service McpRuntimeSidecar {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Readiness(ReadinessRequest) returns (ReadinessResponse);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc CheckCompatibility(CompatibilityCheckRequest) returns (CompatibilityCheckResponse);
}

message HealthRequest {}

message HealthResponse {
  maf.common.v1.HealthState state = 1;
  maf.common.v1.VersionInfo version = 2;
  maf.common.v1.TypedError error = 3;
}

message ReadinessRequest {}

message ReadinessResponse {
  maf.common.v1.ReadinessState state = 1;
  maf.common.v1.VersionInfo version = 2;
  bool compatibility_handshake_passed = 3;
  maf.common.v1.TypedError error = 4;
}

message VersionRequest {}

message VersionResponse {
  maf.common.v1.VersionInfo version = 1;
}

message CompatibilityCheckRequest {
  string client_version = 1;
  string expected_component = 2;
  string expected_protocol_version = 3;
  string expected_schema_hash = 4;
  string expected_error_code_table_hash = 5;
  repeated string required_features = 6;
}

message CompatibilityCheckResponse {
  bool compatible = 1;
  maf.common.v1.VersionInfo version = 2;
  repeated string missing_features = 3;
  maf.common.v1.TypedError error = 4;
}

// Reserved external MCP metadata carrier. These fields describe remote MCP
// server/session/task correlation and must not be confused with the internal
// Python-to-sidecar protocol version fields above.
message ExternalMcpContext {
  string external_protocol_version = 1;
  map<string, string> server_capabilities = 2;
  map<string, bool> tool_execution_task_support = 3;
  string session_id_fingerprint = 4;
  string last_event_id_fingerprint = 5;
  string progress_token_fingerprint = 6;
  string task_safe_ref = 7;
  string remote_error_code = 8;
  string json_rpc_id_correlation = 9;
}
