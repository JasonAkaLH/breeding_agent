[licenses]
confidence-threshold = 0.8
unused-allowed-license = "warn"
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [
    # Keep CDLA-Permissive-2.0 scoped to the official MCP SDK TLS root
    # bundle instead of globally allowing the license. This dependency is
    # currently introduced by:
    # maf_mcp_runtime -> rmcp -> reqwest -> rustls-platform-verifier ->
    # webpki-root-certs. Future version changes should fail closed and require
    # a fresh license review.
    { crate = "webpki-root-certs@1.0.7", allow = ["CDLA-Permissive-2.0"] },
]
