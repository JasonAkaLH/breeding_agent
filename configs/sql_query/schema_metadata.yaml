version: 1
database:
  name: chatudb
  dialect: mysql
  charset: utf8mb4
schema_profiles:
- profile_id: approval_variety_profile
  route_id: approval_variety_db
  tables:
  - corn_varieties
  - rice_varieties
  - cotton_varieties
  - wheat_varieties
  - soybean_varieties
- profile_id: variety_overview_profile
  route_id: variety_overview
  tables:
  - corn_varieties
  - rice_varieties
  - cotton_varieties
  - wheat_varieties
  - soybean_varieties
  - variety
  - rice_comp
- profile_id: genotype_profile
  route_id: genotype_db
  tables:
  - variety
  - variety_genotype
  - qtn
  - rice_comp
tables:
  variety:
    description: 水稻品种信息表
    primary_key:
    - variety_id
    route_tags:
    - genotype_db
    - rice
    expose_to_llm: true
    allow_sql_generation: true
    columns:
      variety_id:
        sql_type: int(11)
        description: 自增ID
        expose_to_llm: true
      variety_name:
        sql_type: varchar(100)
        description: 品种名称
        expose_to_llm: true
  variety_genotype:
    description: 品种-位点-基因型主表
    primary_key:
    - id
    route_tags:
    - genotype_db
    - rice
    expose_to_llm: true
    allow_sql_generation: true
    columns:
      id:
        sql_type: bigint(20)
        description: 唯一自增ID
        expose_to_llm: false
      variety_id:
        sql_type: int(11)
        description: 品种ID，外键，指向variety表
        expose_to_llm: true
      qtn_id:
        sql_type: int(11)
        description: QTN位点ID，外键，指向qtn表
        expose_to_llm: true
      genotype:
        sql_type: text
        description: 基因型
        expose_to_llm: true
      phenotype:
        sql_type: text
        description: 表现型
        expose_to_llm: true
    foreign_keys:
    - column: variety_id
      ref_table: variety
      ref_column: variety_id
    - column: qtn_id
      ref_table: qtn
      ref_column: qtn_id
  qtn:
    description: QTN位点主表
    primary_key:
    - qtn_id
    route_tags:
    - genotype_db
    - rice
    expose_to_llm: true
    allow_sql_generation: true
    columns:
      qtn_id:
        sql_type: int(11)
        description: QTN内部唯一自增ID
        expose_to_llm: true
      qtn_seq:
        sql_type: varchar(20)
        description: QTN序号（如QTN1）
        expose_to_llm: true
      gene_name:
        sql_type: varchar(100)
        description: 基因名称
        expose_to_llm: true
      gene_id_msu7:
        sql_type: varchar(100)
        description: 基因ID_MSU7
        expose_to_llm: true
      gene_id_rap:
        sql_type: varchar(100)
        description: 基因ID_RAP
        expose_to_llm: true
      gene_desc:
        sql_type: varchar(255)
        description: 基因描述
        expose_to_llm: true
      chr:
        sql_type: varchar(256)
        description: 染色体Chr
        expose_to_llm: true
      pos_7_0:
        sql_type: int(11)
        description: 位点7.0
        expose_to_llm: true
      ref_genotype:
        sql_type: text
        description: 参考基因型
        expose_to_llm: true
      alt_genotype:
        sql_type: text
        description: 变异基因型
        expose_to_llm: true
      effect_info:
        sql_type: varchar(256)
        description: 性状类型
        expose_to_llm: true
  rice_comp:
    description: 水稻成分比例表
    primary_key:
    - id
    route_tags:
    - genotype_db
    - rice
    expose_to_llm: true
    allow_sql_generation: true
    columns:
      id:
        sql_type: int(11)
        description: 自动增长主键
        expose_to_llm: false
      variety_id:
        sql_type: int(11)
        description: 品种ID，外键，指向variety表
        expose_to_llm: true
      variety_name:
        sql_type: varchar(500)
        description: 品种名称
        expose_to_llm: true
      all_indica_comp:
        sql_type: decimal(15, 8)
        description: 全部籼稻成分比例(%)
        expose_to_llm: true
      indica_mix_comp:
        sql_type: decimal(15, 8)
        description: 籼稻混合成分比例(%)
        expose_to_llm: true
      indica_aus_comp:
        sql_type: decimal(15, 8)
        description: 籼稻aus成分比例(%)
        expose_to_llm: true
      indica_ind_comp:
        sql_type: decimal(15, 8)
        description: 籼稻ind成分比例(%)
        expose_to_llm: true
      all_japonica_comp:
        sql_type: decimal(15, 8)
        description: 全部粳稻成分比例(%)
        expose_to_llm: true
      japonica_mix_comp:
        sql_type: decimal(15, 8)
        description: 粳稻混合成分比例(%)
        expose_to_llm: true
      japonica_temp_comp:
        sql_type: decimal(15, 8)
        description: 粳稻温带成分比例(%)
        expose_to_llm: true
      japonica_trop_comp:
        sql_type: decimal(15, 8)
        description: 粳稻热带成分比例(%)
        expose_to_llm: true
      indica_japonica_mix_comp:
        sql_type: decimal(15, 8)
        description: 籼粳混合成分比例(%)
        expose_to_llm: true
    foreign_keys:
    - column: variety_id
      ref_table: variety
      ref_column: variety_id
