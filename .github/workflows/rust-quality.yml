name: Rust quality gates

on:
  pull_request:
    paths:
      - "native/**"
      - "src/**/rust_contract*.py"
      - "src/**/rust_contracts/**"
      - "scripts/run_rust_quality_gates.py"
      - "scripts/run_rust_coverage_thresholds.py"
      - "scripts/rust_artifact_provenance.py"
      - "scripts/prd_evidence.py"
      - "scripts/validate_prd03_runtime_sidecar_evidence.py"
      - "scripts/validate_prd04_skill_runtime_evidence.py"
      - "scripts/validate_prd05_mcp_runtime_evidence.py"
      - "scripts/validate_prd06_safety_kernel_evidence.py"
      - "scripts/validate_prd07_orchestration_hotspot_evidence.py"
      - "src/integrations/mcp/**"
      - "docs/prd/rust/**"
      - "requirements.txt"
      - ".github/workflows/rust-quality.yml"
  push:
    branches: [main, rust_branch]
    paths:
      - "native/**"
      - "src/**/rust_contract*.py"
      - "src/**/rust_contracts/**"
      - "scripts/run_rust_quality_gates.py"
      - "scripts/run_rust_coverage_thresholds.py"
      - "scripts/rust_artifact_provenance.py"
      - "scripts/prd_evidence.py"
      - "scripts/validate_prd03_runtime_sidecar_evidence.py"
      - "scripts/validate_prd04_skill_runtime_evidence.py"
      - "scripts/validate_prd05_mcp_runtime_evidence.py"
      - "scripts/validate_prd06_safety_kernel_evidence.py"
      - "scripts/validate_prd07_orchestration_hotspot_evidence.py"
      - "src/integrations/mcp/**"
      - "docs/prd/rust/**"
      - "requirements.txt"
      - ".github/workflows/rust-quality.yml"
  workflow_dispatch:

jobs:
  rust-quality:
    name: Rust PRD01 quality gates / Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    env:
      CARGO_TERM_COLOR: always
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain from native/rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Set up Python 3.13 for PyO3 workspace gates
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust quality tools
        run: |
          cargo install cargo-nextest --locked
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
          cargo install cargo-llvm-cov --locked

      - name: cargo fmt --check
        working-directory: native
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: native
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --workspace --all-features
        working-directory: native
        run: cargo test --workspace --all-features

      - name: cargo nextest run --workspace --all-features
        working-directory: native
        run: cargo nextest run --workspace --all-features

      - name: cargo audit
        working-directory: native
        run: cargo audit

      - name: cargo deny check
        working-directory: native
        run: cargo deny check

      - name: cargo llvm-cov --workspace --all-features --summary-only
        working-directory: native
        run: cargo llvm-cov --workspace --all-features --summary-only

      - name: python scripts/run_rust_coverage_thresholds.py --run
        run: python scripts/run_rust_coverage_thresholds.py --run

      - name: Check fuzz target manifest readiness
        run: python scripts/run_rust_quality_gates.py --check-fuzz-targets

      - name: Compile PRD01 fuzz harnesses
        run: cargo check --locked --manifest-path native/fuzz/Cargo.toml --bins

      - name: Check PRD06 safety kernel evidence manifest remains fail-closed
        run: python scripts/validate_prd06_safety_kernel_evidence.py --allow-pending

      - name: Check PRD07 orchestration hotspot guard remains conditional
        run: python scripts/validate_prd07_orchestration_hotspot_evidence.py --json

      - name: python scripts/rust_artifact_provenance.py self-test
        run: python scripts/rust_artifact_provenance.py self-test

      - name: Build maf-runtime-sidecar release binary
        working-directory: native
        run: cargo build --release -p maf_runtime_sidecar --bin maf-runtime-sidecar

      - name: Generate RuntimeSidecar binary SBOM / provenance / manifest
        run: |
          set -euo pipefail
          RELEASE_DIR="native/target/runtime-sidecar-release"
          mkdir -p "$RELEASE_DIR"
          SIDECAR_SOURCE="native/target/release/maf-runtime-sidecar"
          SIDECAR_ARTIFACT="$RELEASE_DIR/maf-runtime-sidecar-linux-x86_64"
          test -x "$SIDECAR_SOURCE"
          cp "$SIDECAR_SOURCE" "$SIDECAR_ARTIFACT"
          chmod +x "$SIDECAR_ARTIFACT"
          RUSTC_VERSION="$(rustc --version)"
          cargo metadata --locked --format-version 1 --manifest-path native/Cargo.toml > "$RELEASE_DIR/cargo-metadata.json"
          python scripts/rust_artifact_provenance.py write-sbom \
            --component maf_runtime_sidecar \
            --cargo-metadata "$RELEASE_DIR/cargo-metadata.json" \
            --output "$RELEASE_DIR/maf_runtime_sidecar.sbom.json"
          python scripts/rust_artifact_provenance.py write-provenance \
            --component maf_runtime_sidecar \
            --artifact-id maf_runtime_sidecar \
            --artifact-kind sidecar_binary \
            --artifact-path "$SIDECAR_ARTIFACT" \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash runtime_sidecar=maf_runtime_v1_schema_20260515_edge_artifact \
            --proto-hash runtime=maf_runtime_proto_v1_20260515_edge_artifact \
            --output "$RELEASE_DIR/maf_runtime_sidecar.provenance.json"
          python scripts/rust_artifact_provenance.py generate \
            --component maf_runtime_sidecar \
            --artifact-id maf_runtime_sidecar \
            --artifact-kind sidecar_binary \
            --artifact-path "$SIDECAR_ARTIFACT" \
            --cargo-lock native/Cargo.lock \
            --sbom "$RELEASE_DIR/maf_runtime_sidecar.sbom.json" \
            --provenance "$RELEASE_DIR/maf_runtime_sidecar.provenance.json" \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash runtime_sidecar=maf_runtime_v1_schema_20260515_edge_artifact \
            --proto-hash runtime=maf_runtime_proto_v1_20260515_edge_artifact \
            --output "$RELEASE_DIR/maf_runtime_sidecar.manifest.json"

      - name: Check PRD03 RuntimeSidecar evidence manifest remains fail-closed
        run: python scripts/validate_prd03_runtime_sidecar_evidence.py --allow-pending

      - name: Upload RuntimeSidecar binary release evidence
        uses: actions/upload-artifact@v4
        with:
          name: rust-runtime-sidecar-linux-x86_64
          if-no-files-found: error
          path: |
            native/target/runtime-sidecar-release/maf-runtime-sidecar-linux-x86_64
            native/target/runtime-sidecar-release/maf_runtime_sidecar.sbom.json
            native/target/runtime-sidecar-release/maf_runtime_sidecar.provenance.json
            native/target/runtime-sidecar-release/maf_runtime_sidecar.manifest.json

      - name: Build maf-skill-sandbox release binary
        working-directory: native
        run: cargo build --release -p maf_skill_runtime --bin maf-skill-sandbox

      - name: Generate Skill Sandbox binary SBOM / provenance / manifest
        run: |
          set -euo pipefail
          RELEASE_DIR="native/target/skill-sandbox-release"
          mkdir -p "$RELEASE_DIR"
          SANDBOX_SOURCE="native/target/release/maf-skill-sandbox"
          SANDBOX_ARTIFACT="$RELEASE_DIR/maf-skill-sandbox-linux-x86_64"
          test -x "$SANDBOX_SOURCE"
          cp "$SANDBOX_SOURCE" "$SANDBOX_ARTIFACT"
          chmod +x "$SANDBOX_ARTIFACT"
          RUSTC_VERSION="$(rustc --version)"
          cargo metadata --locked --format-version 1 --manifest-path native/Cargo.toml > "$RELEASE_DIR/cargo-metadata.json"
          python scripts/rust_artifact_provenance.py write-sbom \
            --component maf_skill_runtime \
            --cargo-metadata "$RELEASE_DIR/cargo-metadata.json" \
            --output "$RELEASE_DIR/maf_skill_sandbox.sbom.json"
          python scripts/rust_artifact_provenance.py write-provenance \
            --component maf_skill_runtime \
            --artifact-id maf_skill_sandbox \
            --artifact-kind sidecar_binary \
            --artifact-path "$SANDBOX_ARTIFACT" \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash skill_runtime=maf_skill_runtime_schema_gates_20260515 \
            --proto-hash skill=maf_skill_proto_v1_20260515 \
            --output "$RELEASE_DIR/maf_skill_sandbox.provenance.json"
          python scripts/rust_artifact_provenance.py generate \
            --component maf_skill_runtime \
            --artifact-id maf_skill_sandbox \
            --artifact-kind sidecar_binary \
            --artifact-path "$SANDBOX_ARTIFACT" \
            --cargo-lock native/Cargo.lock \
            --sbom "$RELEASE_DIR/maf_skill_sandbox.sbom.json" \
            --provenance "$RELEASE_DIR/maf_skill_sandbox.provenance.json" \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash skill_runtime=maf_skill_runtime_schema_gates_20260515 \
            --proto-hash skill=maf_skill_proto_v1_20260515 \
            --output "$RELEASE_DIR/maf_skill_sandbox.manifest.json"

      - name: Check PRD04 Skill Runtime evidence manifest remains fail-closed
        run: python scripts/validate_prd04_skill_runtime_evidence.py --allow-pending

      - name: Upload Skill Sandbox binary release evidence
        uses: actions/upload-artifact@v4
        with:
          name: rust-skill-sandbox-linux-x86_64
          if-no-files-found: error
          path: |
            native/target/skill-sandbox-release/maf-skill-sandbox-linux-x86_64
            native/target/skill-sandbox-release/maf_skill_sandbox.sbom.json
            native/target/skill-sandbox-release/maf_skill_sandbox.provenance.json
            native/target/skill-sandbox-release/maf_skill_sandbox.manifest.json

      - name: Build maf-mcp-runtime-sidecar release binary
        working-directory: native
        run: cargo build --release -p maf_mcp_runtime --bin maf-mcp-runtime-sidecar

      - name: Generate MCP Runtime sidecar binary SBOM / provenance / manifest
        run: |
          set -euo pipefail
          RELEASE_DIR="native/target/mcp-runtime-release"
          mkdir -p "$RELEASE_DIR"
          MCP_SOURCE="native/target/release/maf-mcp-runtime-sidecar"
          MCP_ARTIFACT="$RELEASE_DIR/maf-mcp-runtime-sidecar-linux-x86_64"
          test -x "$MCP_SOURCE"
          cp "$MCP_SOURCE" "$MCP_ARTIFACT"
          chmod +x "$MCP_ARTIFACT"
          RUSTC_VERSION="$(rustc --version)"
          cargo metadata --locked --format-version 1 --manifest-path native/Cargo.toml > "$RELEASE_DIR/cargo-metadata.json"
          python scripts/rust_artifact_provenance.py write-sbom \
            --component maf_mcp_runtime \
            --cargo-metadata "$RELEASE_DIR/cargo-metadata.json" \
            --output "$RELEASE_DIR/maf_mcp_runtime_sidecar.sbom.json"
          python scripts/rust_artifact_provenance.py write-provenance \
            --component maf_mcp_runtime \
            --artifact-id maf_mcp_runtime_sidecar \
            --artifact-kind sidecar_binary \
            --artifact-path "$MCP_ARTIFACT" \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash mcp_runtime=maf_mcp_v1_phase1_schema_hash_pending_ci \
            --contract-hash mcp_runtime_errors=maf_mcp_runtime_error_table_v1_phase1 \
            --proto-hash mcp=maf_mcp_proto_v1_20260517 \
            --output "$RELEASE_DIR/maf_mcp_runtime_sidecar.provenance.json"
          python scripts/rust_artifact_provenance.py generate \
            --component maf_mcp_runtime \
            --artifact-id maf_mcp_runtime_sidecar \
            --artifact-kind sidecar_binary \
            --artifact-path "$MCP_ARTIFACT" \
            --cargo-lock native/Cargo.lock \
            --sbom "$RELEASE_DIR/maf_mcp_runtime_sidecar.sbom.json" \
            --provenance "$RELEASE_DIR/maf_mcp_runtime_sidecar.provenance.json" \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash mcp_runtime=maf_mcp_v1_phase1_schema_hash_pending_ci \
            --contract-hash mcp_runtime_errors=maf_mcp_runtime_error_table_v1_phase1 \
            --proto-hash mcp=maf_mcp_proto_v1_20260517 \
            --output "$RELEASE_DIR/maf_mcp_runtime_sidecar.manifest.json"

      - name: Check PRD05 MCP Runtime evidence manifest remains fail-closed
        run: python scripts/validate_prd05_mcp_runtime_evidence.py --allow-pending

      - name: Upload MCP Runtime sidecar binary release evidence
        uses: actions/upload-artifact@v4
        with:
          name: rust-mcp-runtime-linux-x86_64
          if-no-files-found: error
          path: |
            native/target/mcp-runtime-release/maf-mcp-runtime-sidecar-linux-x86_64
            native/target/mcp-runtime-release/maf_mcp_runtime_sidecar.sbom.json
            native/target/mcp-runtime-release/maf_mcp_runtime_sidecar.provenance.json
            native/target/mcp-runtime-release/maf_mcp_runtime_sidecar.manifest.json

  rust-fuzz-smoke:
    name: Rust bounded fuzz smoke / Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust for cargo-fuzz only
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1

      - name: Check fuzz Cargo.lock is current
        working-directory: native/fuzz
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: cargo +nightly fuzz run skill_runtime_policy
        working-directory: native/fuzz
        run: cargo +nightly fuzz run skill_runtime_policy -- -max_total_time=30

      - name: cargo +nightly fuzz run artifact_path
        working-directory: native/fuzz
        run: cargo +nightly fuzz run artifact_path -- -max_total_time=30

      - name: cargo +nightly fuzz run auth_core
        working-directory: native/fuzz
        run: cargo +nightly fuzz run auth_core -- -max_total_time=30

      - name: cargo +nightly fuzz run audit_sanitizer
        working-directory: native/fuzz
        run: cargo +nightly fuzz run audit_sanitizer -- -max_total_time=30

      - name: cargo +nightly fuzz run data_access_readonly
        working-directory: native/fuzz
        run: cargo +nightly fuzz run data_access_readonly -- -max_total_time=30

  skill-runtime-pyo3-wheel-smoke:
    name: Rust PyO3 wheel smoke / Ubuntu 22.04 x86_64 / Python 3.13
    runs-on: ubuntu-22.04
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain from native/rust-toolchain.toml
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python build dependencies
        run: python -m pip install -r requirements.txt

      - name: python -m maturin build --release --manifest-path native/crates/maf_skill_runtime_pyo3/Cargo.toml --compatibility manylinux_2_35 --auditwheel check
        run: python -m maturin build --release --locked --manifest-path native/crates/maf_skill_runtime_pyo3/Cargo.toml --interpreter python --compatibility manylinux_2_35 --auditwheel check --out native/target/wheels

      - name: Generate Skill Runtime PyO3 wheel SBOM / provenance / manifest
        run: |
          set -euo pipefail
          mapfile -t WHEELS < <(find native/target/wheels -maxdepth 1 -type f -name 'maf_skill_runtime_pyo3-*.whl' | sort)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "expected exactly one Skill Runtime PyO3 wheel, got ${#WHEELS[@]}" >&2
            printf '%s\n' "${WHEELS[@]}" >&2
            exit 1
          fi
          WHEEL="${WHEELS[0]}"
          RUSTC_VERSION="$(rustc --version)"
          cargo metadata --locked --format-version 1 --manifest-path native/Cargo.toml > native/target/wheels/cargo-metadata.json
          python scripts/rust_artifact_provenance.py write-sbom \
            --component maf_skill_runtime \
            --cargo-metadata native/target/wheels/cargo-metadata.json \
            --output native/target/wheels/maf_skill_runtime_pyo3.sbom.json
          python scripts/rust_artifact_provenance.py write-provenance \
            --component maf_skill_runtime \
            --artifact-id maf_skill_runtime_pyo3 \
            --artifact-kind pyo3_wheel \
            --artifact-path "$WHEEL" \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash skill_runtime=maf_skill_runtime_schema_gates_20260515 \
            --output native/target/wheels/maf_skill_runtime_pyo3.provenance.json
          python scripts/rust_artifact_provenance.py generate \
            --component maf_skill_runtime \
            --artifact-id maf_skill_runtime_pyo3 \
            --artifact-kind pyo3_wheel \
            --artifact-path "$WHEEL" \
            --cargo-lock native/Cargo.lock \
            --sbom native/target/wheels/maf_skill_runtime_pyo3.sbom.json \
            --provenance native/target/wheels/maf_skill_runtime_pyo3.provenance.json \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash skill_runtime=maf_skill_runtime_schema_gates_20260515 \
            --output native/target/wheels/maf_skill_runtime_pyo3.manifest.json

      - name: Install built Skill Runtime PyO3 wheel
        run: python -m pip install --force-reinstall --no-deps native/target/wheels/maf_skill_runtime_pyo3-*.whl

      - name: test_installed_pyo3_module_matches_rust_contract_when_available
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest tests.integrations.agent_skills.test_pyo3_wheel_build_contract.SkillRuntimePyo3WheelBuildContractTest.test_installed_pyo3_module_matches_rust_contract_when_available

      - name: python -m maturin build --release --manifest-path native/crates/maf_core_lifecycle_pyo3/Cargo.toml --compatibility manylinux_2_35 --auditwheel check
        run: python -m maturin build --release --locked --manifest-path native/crates/maf_core_lifecycle_pyo3/Cargo.toml --interpreter python --compatibility manylinux_2_35 --auditwheel check --out native/target/wheels

      - name: Generate Core/Lifecycle PyO3 wheel SBOM / provenance / manifest
        run: |
          set -euo pipefail
          mapfile -t CORE_LIFECYCLE_WHEELS < <(find native/target/wheels -maxdepth 1 -type f -name 'maf_core_lifecycle_pyo3-*.whl' | sort)
          if [ "${#CORE_LIFECYCLE_WHEELS[@]}" -ne 1 ]; then
            echo "expected exactly one Core/Lifecycle PyO3 wheel, got ${#CORE_LIFECYCLE_WHEELS[@]}" >&2
            printf '%s\n' "${CORE_LIFECYCLE_WHEELS[@]}" >&2
            exit 1
          fi
          WHEEL="${CORE_LIFECYCLE_WHEELS[0]}"
          RUSTC_VERSION="$(rustc --version)"
          python scripts/rust_artifact_provenance.py write-sbom \
            --component maf_core_lifecycle \
            --cargo-metadata native/target/wheels/cargo-metadata.json \
            --output native/target/wheels/maf_core_lifecycle_pyo3.sbom.json
          python scripts/rust_artifact_provenance.py write-provenance \
            --component maf_core_lifecycle \
            --artifact-id maf_core_lifecycle_pyo3 \
            --artifact-kind pyo3_wheel \
            --artifact-path "$WHEEL" \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash core=maf_core_types_core_v1_schema_20260515 \
            --contract-hash lifecycle=maf_lifecycle_transition_table_v1_20260515 \
            --output native/target/wheels/maf_core_lifecycle_pyo3.provenance.json
          python scripts/rust_artifact_provenance.py generate \
            --component maf_core_lifecycle \
            --artifact-id maf_core_lifecycle_pyo3 \
            --artifact-kind pyo3_wheel \
            --artifact-path "$WHEEL" \
            --cargo-lock native/Cargo.lock \
            --sbom native/target/wheels/maf_core_lifecycle_pyo3.sbom.json \
            --provenance native/target/wheels/maf_core_lifecycle_pyo3.provenance.json \
            --source ci_pipeline \
            --git-commit "${{ github.sha }}" \
            --toolchain "$RUSTC_VERSION" \
            --target-triple x86_64-unknown-linux-gnu \
            --build-profile release \
            --cargo-feature default \
            --contract-hash core=maf_core_types_core_v1_schema_20260515 \
            --contract-hash lifecycle=maf_lifecycle_transition_table_v1_20260515 \
            --output native/target/wheels/maf_core_lifecycle_pyo3.manifest.json

      - name: Install built Core/Lifecycle PyO3 wheel
        run: python -m pip install --force-reinstall --no-deps native/target/wheels/maf_core_lifecycle_pyo3-*.whl

      - name: test_installed_pyo3_module_matches_core_lifecycle_contract_when_available
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest tests.integrations.test_core_lifecycle_pyo3_wheel_contract.CoreLifecyclePyo3WheelContractTest.test_installed_pyo3_module_matches_core_lifecycle_contract_when_available

      - name: python -m maturin build --release --manifest-path native/crates/maf_safety_kernels_pyo3/Cargo.toml --compatibility manylinux_2_35 --auditwheel check
        run: python -m maturin build --release --locked --manifest-path native/crates/maf_safety_kernels_pyo3/Cargo.toml --interpreter python --compatibility manylinux_2_35 --auditwheel check --out native/target/wheels

      - name: Generate Safety Kernels PyO3 wheel SBOM / provenance / manifest
        run: |
          set -euo pipefail
          mapfile -t SAFETY_WHEELS < <(find native/target/wheels -maxdepth 1 -type f -name 'maf_safety_kernels_pyo3-*.whl' | sort)
          if [ "${#SAFETY_WHEELS[@]}" -ne 1 ]; then
            echo "expected exactly one Safety Kernels PyO3 wheel, got ${#SAFETY_WHEELS[@]}" >&2
            printf '%s\n' "${SAFETY_WHEELS[@]}" >&2
            exit 1
          fi
          WHEEL="${SAFETY_WHEELS[0]}"
          RUSTC_VERSION="$(rustc --version)"
          python scripts/rust_artifact_provenance.py write-sbom \
            --component maf_safety_kernels \
            --cargo-metadata native/target/wheels/cargo-metadata.json \
            --output native/target/wheels/maf_safety_kernels_pyo3.sbom.json
          python scripts/rust_artifact_provenance.py write-provenance \
            --component maf_safety_kernels \
            --artifact-id maf_safety_kernels_pyo3 \
            --artifact-kind pyo3_wheel \
            --artifact-path "$WHEEL" \
